name: Build & Release APK

# يبني نسخة APK للإصدار عند كل دفع إلى main، ثم ينشرها في إصدار ثابت "latest"
# مع version.json لتغذية نظام التحديث الذاتيّ داخل التطبيق.

on:
  push:
    branches: [ main ]
  workflow_dispatch:      # تشغيل يدوي عند الحاجة

permissions:
  contents: write         # لإنشاء/تحديث الإصدارات

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: سحب الكود
        uses: actions/checkout@v4

      - name: تهيئة JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: تهيئة Android SDK
        uses: android-actions/setup-android@v3

      - name: صلاحية تنفيذ gradlew
        run: chmod +x ./gradlew

      - name: بناء APK للإصدار (رقم البناء = run_number)
        env:
          APP_BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: تجهيز ملفات الإصدار (APK باسم ثابت + version.json)
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/WhatsAppReminder.apk"
          cat > release/version.json <<EOF
          {
            "version": "1.0.${{ github.run_number }}",
            "build": ${{ github.run_number }},
            "url": "https://github.com/${{ github.repository }}/releases/download/latest/WhatsAppReminder.apk"
          }
          EOF
          echo "----- version.json -----"; cat release/version.json

      - name: نشر إلى إصدار latest (رابط دائم لأحدث نسخة)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: أحدث نسخة (latest)
          body: "نسخة تلقائية 1.0.${{ github.run_number }} — تُثبَّت فوق القديمة (نظام التحديث الذاتيّ)."
          files: |
            release/WhatsAppReminder.apk
            release/version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
